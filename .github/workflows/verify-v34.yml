name: V34 complete reproducibility audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v34.yml
      - release/Sahab_V34_GitHub_Complete_Reproducibility_20261012.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-replay:
    name: Original V34 finite-sample numerical replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify full source ZIP checksum
        run: |
          echo "4971969d21f1ba09741e2551eba952a21ef2bb1d4cd33334066e45cb7e73cb95  release/Sahab_V34_GitHub_Complete_Reproducibility_20261012.zip" | sha256sum -c -
      - name: Extract complete three-study archive
        run: |
          mkdir -p "$RUNNER_TEMP/sahab-v34"
          python -m zipfile -e release/Sahab_V34_GitHub_Complete_Reproducibility_20261012.zip "$RUNNER_TEMP/sahab-v34"
          test -f "$RUNNER_TEMP/sahab-v34/code/verify_v34.py"
          test -f "$RUNNER_TEMP/sahab-v34/data_confidential/Zagreb25_primary.csv"
      - name: Install declared dependencies
        run: python -m pip install -r "$RUNNER_TEMP/sahab-v34/requirements.txt"
      - name: Run original complete numerical and hash verification
        working-directory: ${{ runner.temp }}/sahab-v34
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python code/verify_v34.py
          python verify_release.py
