name: V34 complete reproducibility audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v34.yml
      - audit/verify_cross_environment.py
      - release/Sahab_V34_GitHub_Complete_Reproducibility_20261012.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-replay:
    name: V34 frozen numerical and source-integrity replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact original full ZIP SHA-256
        run: |
          echo "4971969d21f1ba09741e2551eba952a21ef2bb1d4cd33334066e45cb7e73cb95  release/Sahab_V34_GitHub_Complete_Reproducibility_20261012.zip" | sha256sum -c -
      - name: Extract original full archive without modifications
        run: |
          mkdir -p "$RUNNER_TEMP/sahab-v34"
          python -m zipfile -e release/Sahab_V34_GitHub_Complete_Reproducibility_20261012.zip "$RUNNER_TEMP/sahab-v34"
          test -f "$RUNNER_TEMP/sahab-v34/code/verify_v34.py"
          test -f "$RUNNER_TEMP/sahab-v34/data_confidential/Zagreb25_primary.csv"
      - name: Install originally declared dependency ranges
        run: python -m pip install -r "$RUNNER_TEMP/sahab-v34/requirements.txt"
      - name: Verify 54 original file checksums
        working-directory: ${{ runner.temp }}/sahab-v34
        run: python verify_release.py
      - name: Original verifier strict byte parity (environment-dependent diagnostic)
        id: strict_byte
        continue-on-error: true
        working-directory: ${{ runner.temp }}/sahab-v34
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python code/verify_v34.py
      - name: Independent SLSQP and cross-library numeric parity (required)
        working-directory: ${{ github.workspace }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python audit/verify_cross_environment.py "$RUNNER_TEMP/sahab-v34"
      - name: Record strict-byte versus numerical status
        if: always()
        env:
          STRICT_RESULT: ${{ steps.strict_byte.outcome }}
        run: |
          echo "### V34 verification summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Original archive SHA-256: verified against fixed historical value." >> "$GITHUB_STEP_SUMMARY"
          echo "- Original 54-file SHA-256 manifest: see separate job step." >> "$GITHUB_STEP_SUMMARY"
          echo "- Strict original byte replay: $STRICT_RESULT (can vary with NumPy/SciPy/pandas)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Numeric parity and 80 independent SLSQP checks: see required numerical audit step." >> "$GITHUB_STEP_SUMMARY"
